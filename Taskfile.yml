# Run Task with the pinned version: ./tool.sh task
version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - ./tool.sh task --list
    silent: true

  ci:
    desc: Run the local equivalent of CI checks and image builds
    deps:
      - verify
      - vet
      - fmt-check
      - lint
      - k8s-lint
      - tailwind-check
      - docker-build-all

  verify:
    desc: Run the broader local verification suite
    deps:
      - fmt
      - vet
      - test
      - lint
      - crap
      - js-lint
      - k8s-lint
      - tailwind-check

  fmt:
    desc: Format Go code with gofumpt
    cmds:
      - ./tool.sh gofumpt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    deps:
      - golangci-lint
    cmds:
      - ./bin/golangci-lint run ./... --timeout=5m

  crap:
    desc: Run go-crap complexity scan
    cmds:
      - ./tool.sh go-crap scan --top 10 --exclude '.*_test\.go' --exclude '.*\.gen\.go' --exclude 'main\.go' --threshold 250 --fail-above

  fmt-check:
    desc: Check Go formatting with gofumpt
    cmds:
      - |
        files="$(./tool.sh gofumpt -l .)"
        test -z "$files" || {
          printf '%s\n' "$files"
          exit 1
        }

  k8s-lint:
    desc: Validate Kubernetes manifests with kubeconform
    cmds:
      - ./tool.sh kubeconform -strict -summary deploy/*.yaml

  js-lint:
    desc: Syntax-check JavaScript assets
    cmds:
      - npm exec --yes --package eslint@10.4.0 -- eslint internal/static/user-clerk-billing.js internal/static/share.js

  test:
    desc: Run tests with mocks enabled by default
    env:
      ENABLE_MOCKS: '{{default "1" .ENABLE_MOCKS}}'
    cmds:
      - go test ./...

  css:
    desc: Rebuild Tailwind output
    cmds:
      - bash tailwind/generate.sh

  tailwind-check:
    desc: Regenerate Tailwind output and fail on uncommitted changes
    cmds:
      - bash tailwind/generate.sh
      - git diff --exit-code

  docker-build:
    desc: Build one Docker image locally without pushing
    vars:
      CMD_PATH: '{{default "./cmd/careme" .CMD_PATH}}'
      IMAGE: '{{default "careme-local" .IMAGE}}'
    cmds:
      - docker build --build-arg CMD_PATH={{.CMD_PATH}} -t {{.IMAGE}} .

  docker-build-all:
    desc: Build the same image matrix as CI locally without pushing
    internal: true
    deps:
      - docker-build-careme
      - docker-build-wholefoods
      - docker-build-albertsons
      - docker-build-publix
      - docker-build-publixabck
      - docker-build-aldi
      - docker-build-reese84

  docker-build-careme:
    desc: Build the careme image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/careme
          IMAGE: careme-local

  docker-build-wholefoods:
    desc: Build the wholefoods image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/wholefoods
          IMAGE: careme-wholefoods-local

  docker-build-albertsons:
    desc: Build the albertsons image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/albertsons
          IMAGE: careme-albertsons-local

  docker-build-publix:
    desc: Build the publix image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/publix
          IMAGE: careme-publix-local

  docker-build-publixabck:
    desc: Build the publixabck image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/publixabck
          IMAGE: careme-publixabck-local

  docker-build-aldi:
    desc: Build the aldi image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/aldi
          IMAGE: careme-aldi-local

  docker-build-reese84:
    desc: Build the reese84 image locally
    internal: true
    cmds:
      - task: docker-build
        vars:
          CMD_PATH: ./cmd/reese84
          IMAGE: careme-reese84-local

  serve:
    desc: Run the local web server
    vars:
      ADDR: '{{default ":8080" .ADDR}}'
    cmds:
      - go run ./cmd/careme -serve -addr {{.ADDR}}

  zipcode:
    desc: Look up locations for a ZIP code
    vars:
      ZIP: '{{default "98101" .ZIP}}'
    cmds:
      - go run ./cmd/careme -zipcode {{.ZIP}}

  producecheck:
    desc: Run produce scoring checks for generator changes
    vars:
      LOCATION: '{{default "70500874" .LOCATION}}'
    cmds:
      - go run ./cmd/producecheck -location {{.LOCATION}}

  recipe-eval:
    desc: Evaluate ingredient coverage and step quantities in fresh AI recipes
    env:
      PROMPTFOO_CONFIG_DIR: .promptfoo
      PROMPTFOO_DISABLE_TELEMETRY: "true"
      PROMPTFOO_DISABLE_WAL_MODE: "true"
    cmds:
      - npm exec --prefix evals/recipe-instructions -- promptfoo eval --config evals/recipe-instructions/promptfooconfig.yaml --no-cache --no-share --output /tmp/careme-recipe-eval.json
      - jq -e '.results.stats.failures == 0 and .results.stats.errors == 0' /tmp/careme-recipe-eval.json

  recipe-eval-view:
    desc: Open the local Promptfoo recipe eval results viewer
    env:
      PROMPTFOO_CONFIG_DIR: .promptfoo
      PROMPTFOO_DISABLE_TELEMETRY: "true"
      PROMPTFOO_DISABLE_WAL_MODE: "true"
    cmds:
      - npm exec --prefix evals/recipe-instructions -- promptfoo view

  deploy:
    desc: Deploy the app using deploy/deploy.sh
    vars:
      REF: '{{default "origin/master" .REF}}'
      NAMESPACE: '{{default "careme" .NAMESPACE}}'
    cmds:
      - bash deploy/deploy.sh {{.REF}} {{.NAMESPACE}}

  golangci-lint:
    internal: true
    status:
      - test -x ./bin/golangci-lint
    cmds:
      - bash tools/install-golangci-lint.sh
