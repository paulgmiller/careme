name: Tailwind CSS Check

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  tailwind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go

      - name: Check Tailwind CSS
        run: ./task.sh tailwind-check
