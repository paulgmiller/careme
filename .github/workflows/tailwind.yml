name: Tailwind CSS Check

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  tailwind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/tool.sum

      - name: Check Tailwind CSS
        run: ./task.sh tailwind-check
