name: Go statement diff

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  statements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go install github.com/paulgmiller/go-statement@latest

      - name: Report statement diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go-statement diff "$BASE_SHA...HEAD" > statement-diff.txt
          cat statement-diff.txt
          {
            echo '### Go statement diff'
            echo '```text'
            cat statement-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
