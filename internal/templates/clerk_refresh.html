{{if (ClerkEnabled)}}
{{/* Keep both scripts deferred and in order: session.js uses the loaded Clerk
global and installs its HTMX listeners before DOMContentLoaded. */}}
<script
  defer
  crossorigin="anonymous"
  data-clerk-publishable-key="{{ClerkPublishableKey}}"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@{{ClerkJSVersion}}/dist/clerk.browser.js">
</script>
<script defer src="{{AssetPath}}session.js" data-server-signed-in="{{.ServerSignedIn}}"></script>
{{end}}
