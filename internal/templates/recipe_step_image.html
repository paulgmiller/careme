{{define "step_image"}}
{{if .ServerSignedIn}}
<div id="step-image-{{.Number}}" class="print-hidden basis-full">
  {{if .HasImage}}
  <details open>
    <summary data-step-image-action aria-label="Toggle illustration for step {{.Number}}" title="Toggle illustration for step {{.Number}}"
             class="ml-8 inline-flex size-9 cursor-pointer list-none items-center justify-center rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-brand-400 [&::-webkit-details-marker]:hidden">
      {{template "icon_eye" .}}
    </summary>
    <a href="/recipe/{{.Hash}}/steps/{{.Number}}/image" target="_blank" rel="noopener" class="mt-2 block w-full max-w-md"
       aria-label="View illustration for step {{.Number}}" title="View illustration for step {{.Number}}">
      <img src="/recipe/{{.Hash}}/steps/{{.Number}}/image" alt="Pencil sketch of step {{.Number}}" loading="lazy"
           class="h-auto w-full rounded-xl border border-brand-100" />
    </a>
  </details>
  {{else}}
  <button type="button" data-step-image-action
          hx-post="/recipe/{{.Hash}}/steps/{{.Number}}/image" hx-target="#step-image-{{.Number}}" hx-swap="outerHTML" hx-disabled-elt="this"
          aria-label="Generate illustration for step {{.Number}}" title="Generate illustration for step {{.Number}}"
          class="ml-8 inline-flex size-9 items-center justify-center rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-brand-400 disabled:opacity-50">
    {{template "icon_eye" .}}
  </button>
  <span class="ml-2 hidden text-xs text-gray-500" data-step-image-status role="status"></span>
  {{end}}
</div>
{{end}}
{{end}}
