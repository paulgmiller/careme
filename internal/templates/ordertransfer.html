<!doctype html>
<html lang="en">
<head>
  {{template "page_head" .Page}}
</head>
<body class="min-h-screen bg-gradient-to-b from-brand-50 to-white text-ink-700 antialiased">
  <main class="mx-auto max-w-xl px-4 py-10">
    <section class="friendly-card border border-brand-100 bg-white/90 p-8 shadow-xl">
      <h1 class="text-2xl font-semibold text-brand-700">Your cart needs a moment</h1>
      <p role="alert" class="mt-4 text-sm text-ink-700">{{.Message}}</p>
      <div class="mt-6 flex flex-wrap items-center gap-4">
        {{with .Retry}}{{template "shopping_order_form" .}}{{end}}
        {{if .CartURL}}<a href="{{.CartURL}}" class="font-medium text-brand-600 underline">Review cart</a>{{end}}
        <a href="{{.ReturnURL}}" class="font-medium text-brand-600 underline">Back to shopping list</a>
      </div>
    </section>
  </main>
</body>
</html>
