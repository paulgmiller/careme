<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="{{.Campaign.Blurb}}" />
  <title>{{.Campaign.Title}} | Careme</title>

  {{template "app_head" .Style}}

  {{.ClarityScript}}
  {{.GoogleTagScript}}
  <meta name='impact-site-verification' value='eee2b715-38ff-4749-8396-f05aa85220db'>
</head>
<body class="relative min-h-screen overflow-x-hidden bg-gradient-to-b from-brand-50/80 via-white to-brand-50/80 text-ink-700 antialiased">
  {{GoogleTagNoScript}}
  {{template "seasonal_background" .}}

  <main class="relative z-10 px-4 py-4 sm:py-8">
    <section class="mx-auto w-full max-w-3xl">
      <div class="friendly-card border border-brand-100 bg-white/88 shadow-2xl backdrop-blur-[2px]">
        <!-- Header -->
        <div class="border-b border-brand-100 p-4 sm:p-6">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h1 class="font-display text-3xl font-extrabold sm:text-4xl tracking-tight text-brand-700">Careme</h1>
              <p class="mt-2 text-ink-600">
                {{.Campaign.Title}}
              </p>
            </div>
            {{if .User}}{{template "account_widget" .}}{{end}}
          </div>
        </div>

        <!-- Content -->
        <div class="p-4 sm:p-6">
          <div class="mx-auto max-w-xl space-y-6">
            <div class="friendly-card-soft border border-brand-100 bg-brand-50/40 p-4">
              <p class="text-ink-700">{{.Campaign.Blurb}}</p>
            </div>

            <div class="friendly-card-soft border border-brand-100 bg-brand-50/40 p-4">
              <h2 class="text-lg font-semibold text-brand-700">Find a store</h2>
              <form method="GET" action="/locations" class="mt-3 space-y-2">
                <input type="hidden" name="instructions" value="{{.Campaign.Instructions}}" />
                <label for="zip" class="sr-only">
                  Enter ZIP code:
                </label>
                <div class="flex flex-col gap-3">
                  <input id="zip" name="zip" type="text" inputmode="numeric" pattern="\d{5}" required
                        placeholder="Enter zip code e.g. 90210"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-ink-900 placeholder-gray-400 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400" />
                  <button type="submit"
                          class="inline-flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 font-medium text-white shadow-md transition hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:ring-offset-2">
                    Find stores
                  </button>
                  <button type="button" id="use-location-btn"
                          class="inline-flex w-full items-center justify-center rounded-lg border border-brand-300 bg-white px-3 py-2 text-sm font-medium text-brand-700 shadow-sm transition hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:ring-offset-2">
                    Use your location
                  </button>
                  <p id="use-location-message" class="hidden text-xs text-ink-600" aria-live="polite"></p>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>

    </section>
  </main>
  {{template "clerk_refresh.html" .}}
  <script>
    (() => {
      const button = document.getElementById("use-location-btn");
      const message = document.getElementById("use-location-message");

      if (!button || !message) {
        return;
      }

      const showMessage = (text) => {
        message.classList.remove("hidden");
        message.textContent = text;
      };

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          showMessage("Sorry, chef. Location is not available in this browser.");
          return;
        }

        showMessage("Finding nearby stores...");
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const params = new URLSearchParams(new FormData(button.form));
            params.delete("zip");
            params.set("lat", position.coords.latitude.toString());
            params.set("lon", position.coords.longitude.toString());
            window.location.assign(`/locations?${params}`);
          },
          () => {
            showMessage("Sorry, chef. Have to allow location access.");
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 },
        );
      });
    })();
  </script>
</body>
</html>
