<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Signing In</title>
    {{.GoogleTagScript}}
  </head>
  <body>
  {{GoogleTagNoScript}}
    <script
      crossorigin="anonymous"
      data-clerk-publishable-key="{{.PublishableKey}}"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@{{ClerkJSVersion}}/dist/clerk.browser.js"></script>
    <script>
      Clerk.load().then(() => {
        // Just loading Clerk on your domain is often enough to finalize cookies in dev.
        const url = new URL(location.href);
        url.searchParams.delete("__clerk_db_jwt");
        history.replaceState({}, "", url.toString());

        const returnTo = "{{.ReturnTo}}" || "/";
        const userExistsURL = "{{.UserExistsURL}}";
        const finishRedirect = (conversionEvent = "") => {
          const destination = new URL(returnTo, location.origin);
          if (conversionEvent) {
            destination.searchParams.set("conversion", conversionEvent);
          }
          location.replace(destination);
        };

        const checkUserExists = async () => {
          const response = await fetch(userExistsURL, {
            method: "GET",
            credentials: "same-origin",
            headers: {
              "Accept": "application/json",
            },
          });
          if (!response.ok) {
            console.warn(`auth user exists failed: ${response.status}`);
            return { exists: true };
          }
          return response.json();
        };

        checkUserExists().then((payload) => {
          if (!payload.exists) {
            finishRedirect("{{SignupCompletedConversion}}");
            return;
          }
          finishRedirect();
        });
      });
    </script>
  </body>
</html>
