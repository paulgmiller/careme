description: Recipe critique model quality, latency, and cost comparison
evaluateOptions:
  maxConcurrency: 16

# The candidate provider ignores the rendered prompt and reads recipe or
# recipe_hash from the test variables. It uses the production critique prompt
# and schema, with the model selected by each Promptfoo provider entry.
prompts:
  - recipe-critique-eval

providers:
  - id: 'file://provider.go'
    label: Gemini 3.1 Pro
    config:
      model: google/gemini-3.1-pro-preview
  - id: 'file://provider.go'
    label: Google Flash Latest
    config:
      model: '~google/gemini-flash-latest'
  # both way slower and not cheaper than gemini pro
  #- id: 'file://provider.go'
  #  label: Claude Sonnet 5
  #  config:
  #    model: anthropic/claude-sonnet-5
  #- id: 'file://provider.go'
  #  label: Kimi K3
  #  config:
  #    model: moonshotai/kimi-k3

defaultTest:
  assert:
    - type: latency
      threshold: 30000
      metric: critique-latency-under-30s
    - type: is-json
      metric: critique-json
    - type: javascript
      value: |
        const critique = JSON.parse(output);
        const severities = new Set(['low', 'medium', 'high']);
        const categories = new Set(['cookability', 'safety', 'clarity', 'flavor', 'timing', 'cost', 'nutrition', 'ingredient_usage', 'presentation']);
        return critique.schema_version === 'recipe-critique-v1'
          && Number.isInteger(critique.overall_score)
          && critique.overall_score >= 1
          && critique.overall_score <= 10
          && typeof critique.summary === 'string'
          && critique.summary.trim().length > 0
          && Array.isArray(critique.strengths)
          && Array.isArray(critique.issues)
          && Array.isArray(critique.suggested_fixes)
          && critique.issues.every((issue) =>
            severities.has(issue.severity)
            && categories.has(issue.category)
            && typeof issue.detail === 'string'
            && issue.detail.trim().length > 0)
          && (critique.issues.length === 0
            || critique.suggested_fixes.some((fix) => typeof fix === 'string' && fix.trim().length >= 8));
      metric: valid-critique
    - type: llm-rubric
      metric: critique-usefulness
      threshold: 0.7
      provider: 'file://judge/provider.go'
      value: |
        Judge whether this critique is genuinely useful to a home cook deciding
        whether and how to improve the recipe below.

        Reward:
        - accurate identification of consequential cooking, safety, timing,
          ingredient-usage, seasoning, clarity, cost, nutrition, and presentation issues;
        - coverage of the recipe's most important real defects without inventing others;
        - concrete, proportionate fixes that preserve the recipe's intent;
        - strengths and an overall score calibrated to the actual recipe quality.

        Do not penalize a critique for omitting trivial stylistic preferences. Penalize
        unsupported or distracting criticism, especially invented salt defects. Product
        IDs, aisle numbers, prices, response IDs, hashes, and cache keys are server-owned
        metadata and are not culinary defects.

        Treat these Careme editorial requirements as authoritative even when generic
        cooking advice differs:
        - recipes must give salt by volume in teaspoons or tablespoons and name the salt
          type because crystal sizes vary;
        - preferred concise doneness targets are 140–145°F for pork loin or chops,
          160°F for ground meat, 165°F for poultry (with breast pulled near 160°F and
          rested), 175–185°F for poultry thighs, 125–130°F for salmon, and 135–140°F
          for lean white fish;
        - a critique must not replace those preferred fish or intact-meat ranges with
          a conventional or government-agency temperature merely because it is higher;
        - preparation must precede active cooking, exact divided ingredient amounts
          must reconcile across steps, and unrelated tangents should be removed.

        Score 0.90–1.00 for an exceptionally accurate and actionable critique; 0.70–0.89
        for a useful critique with only minor misses; 0.40–0.69 for a critique with a
        material miss or distracting false positive; and 0.00–0.39 for a misleading or
        largely unhelpful critique. Set pass=true exactly when score is at least 0.70.

        Recipe JSON:
        {{ recipe | dump }}

tests: 'file://tests.yaml'
