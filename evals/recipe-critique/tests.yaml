- description: Detect unsafe ground-beef serving temperature and propose a concrete fix
  vars:
    recipe:
      title: Weeknight Beef Burgers
      description: Simple skillet burgers with a crisp salad.
      properties:
        total_minutes: 25
        servings: 2
        estimated_cost_dollars: 14
        calories_per_serving: 620
        cooking_methods: [stovetop]
      ingredients:
        - name: Ground beef
          quantity: 12 ounces
        - name: Kosher salt
          quantity: 1 teaspoon
        - name: Burger buns
          quantity: "2"
        - name: Mixed greens
          quantity: 4 ounces
      instructions:
        - Shape the 12 ounces ground beef with 1 teaspoon kosher salt into two patties.
        - Sear the patties until their centers reach 145°F, then serve immediately on the 2 buns.
        - Plate with the 4 ounces mixed greens.
      health: ''
      drink_pairing: Iced tea
      wine_styles: []
  assert:
    - type: javascript
      value: |
        const critique = JSON.parse(output);
        const issues = critique.issues.map((issue) => `${issue.category} ${issue.detail}`).join(' ');
        const fixes = critique.suggested_fixes.join(' ');
        return /safety/i.test(issues)
          && /ground beef|burger/i.test(issues)
          && /145|temperature|undercook/i.test(issues)
          && /160\s*(?:°|degrees?)?\s*f?/i.test(fixes);
      metric: detects-unsafe-ground-beef-temperature

- description: Review brined chicken with restrained finishing salt
  vars:
    recipe:
      title: Brined Chicken and Green Beans
      description: A quick skillet dinner built around already-brined chicken.
      properties:
        total_minutes: 30
        servings: 2
        estimated_cost_dollars: 11
        calories_per_serving: 380
        cooking_methods: [stovetop]
      ingredients:
        - name: Pre-brined boneless chicken breasts
          quantity: 12 ounces
        - name: Green beans
          quantity: 8 ounces
        - name: Olive oil
          quantity: 1 tablespoon
        - name: Diamond Crystal kosher salt
          quantity: 3/4 teaspoon
        - name: Black pepper
          quantity: 1/4 teaspoon
        - name: Garlic
          quantity: 1 clove
        - name: Lemon
          quantity: "1"
      instructions:
        - Pat dry the 12 ounces pre-brined chicken breasts and season them with 1/8 teaspoon black pepper; trim the 8 ounces green beans, thinly slice the 1 garlic clove, zest the 1 lemon, halve it, and cut one half into 2 wedges.
        - Heat 2 teaspoons olive oil in a 10-inch skillet over medium-high heat. Cook the chicken undisturbed for 5 to 6 minutes until golden, flip, and cook for 4 to 6 minutes until the center reaches 160°F. Transfer it to a board and rest for 5 minutes to reach 165°F.
        - While the chicken rests, keep the same skillet over medium-high heat and add the remaining 1 teaspoon olive oil. Sauté the 8 ounces green beans with the 3/4 teaspoon Diamond Crystal kosher salt, sliced garlic, and remaining 1/8 teaspoon black pepper for 4 to 6 minutes until blistered and crisp-tender. Stir in the lemon zest and juice from the remaining lemon half.
        - Slice the rested chicken and arrange it beside the green beans with the 2 lemon wedges. Taste before adding any finishing salt because the chicken is already brined.
      health: ''
      drink_pairing: Sparkling water with lemon
      wine_styles: []
- description: Real cooked recipe (4 stars) — Basque pork with summer pipérade
  metadata:
    source: cooked-production-recipe
    source_recipe_hash: qlawhmJMpHubSnBPW4JHYw==
    cooked_rating: 4
  vars:
    recipe:
      title: Basque Pork with Summer Pipérade
      description: Smoky-sweet summer pipérade and juicy golden pork chops make this vibrant Basque lunch worthy of an anniversary table.
      properties:
        total_minutes: 35
        servings: 2
        estimated_cost_dollars: 7
        calories_per_serving: 470
        cooking_methods: [stovetop]
      ingredients:
        - id: '0029319000000'
          aisle_number: '101'
          name: Boneless Pork Loin Center-Cut Thin Chops
          quantity: 12 oz
          price: $4.99
        - id: '0000000004688'
          aisle_number: '0'
          name: Fresh Red Hothouse Bell Pepper
          quantity: 1 pepper
          price: $1.67
        - id: '0000000004664'
          aisle_number: '0'
          name: Fresh On the Vine Red Tomatoes by the Bunch (4-5 tomatoes per bunch)
          quantity: 8 oz
          price: $2.49
        - id: '0000000004093'
          aisle_number: '0'
          name: Jumbo Yellow Onions
          quantity: 4 oz
          price: $1.49
        - id: '0000000004608'
          aisle_number: '0'
          name: Garlic
          quantity: 1 clove
          price: $1.29
        - id: '0000000094901'
          aisle_number: '0'
          name: Organic Italian Parsley
          quantity: 2 tbsp chopped
          price: $2.69
        - id: ''
          name: olive oil
          quantity: 2 tbsp
        - id: ''
          name: kosher salt
          quantity: 9.25 g
        - id: ''
          name: black pepper
          quantity: 1/4 tsp
        - id: ''
          name: smoked paprika
          quantity: 1/2 tsp
        - id: ''
          name: sherry vinegar
          quantity: 1 tsp
      instructions:
        - |-
          Prepare the produce:

          - 1 Fresh Red Hothouse Bell Pepper, stemmed, seeded, and thinly sliced
          - 4 oz Jumbo Yellow Onions, thinly sliced
          - 8 oz Fresh On the Vine Red Tomatoes, cored and diced
          - 1 garlic clove, minced
          - 2 tbsp Organic Italian Parsley, chopped

          Keep each prepared ingredient separate.
        - Pat 12 oz Boneless Pork Loin Center-Cut Thin Chops dry. Season all over with 4.25 g kosher salt and 1/4 tsp black pepper; let stand while starting the pipérade.
        - Heat 1 tbsp olive oil in a large skillet over medium-high heat. Add the sliced pepper, sliced onion, and 5 g kosher salt. Cook for 6–7 minutes, stirring occasionally, until tender and lightly browned.
        - Add the minced garlic and 1/2 tsp smoked paprika; stir for 30 seconds. Add the diced tomatoes and cook for 4–5 minutes, until saucy but still colorful. Stir in 1 tsp sherry vinegar, then transfer the pipérade to a bowl and cover.
        - Carefully wipe the skillet clean with a paper towel held in tongs. Return it to medium-high heat and add 1 tbsp olive oil. Sear the seasoned pork for 2–3 minutes per side, pulling it from the heat when the centers reach 140°F. Rest for 5 minutes.
        - Spoon the warm pipérade onto two plates. Slice the rested pork on a slight diagonal, arrange it over the vegetables, and finish with the chopped parsley.
      health: ''
      drink_pairing: A lightly chilled Rioja complements the sweet peppers, smoked paprika, and savory pork.
      wine_styles: [Rioja]
      response_id: resp_0994921b05044ccb006a91aa49650087d0aff781922f2a2662
