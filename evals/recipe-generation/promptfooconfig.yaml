description: Recipe generation eval
evaluateOptions:
  maxConcurrency: 1

# The Go provider ignores the rendered prompt and reads the test variables.
prompts:
  - recipe-generation-eval

providers:
  - id: 'file://provider.go'
    label: 'recipe-generation {{ env.RECIPE_EVAL_MODEL }}'
    config:
      # model overrides RECIPE_EVAL_MODEL; empty uses the production default.
      model: '{{ env.RECIPE_EVAL_MODEL }}'
      # Keep the judge fixed while comparing generation models.
      judge_model: google/gemini-3.1-pro-preview

defaultTest:
  assert:
    - type: latency
      threshold: 60000
      metric: generation-latency-under-60s
    - type: javascript
      value: |
        const critique = context.providerResponse.metadata.critique;
        return {
          pass: critique.overall_score >= 8,
          score: critique.overall_score / 10,
          reason: `${critique.overall_score}/10: ${critique.summary} Fixes: ${critique.suggested_fixes.join("; ")}`,
        };
      metric: critique-quality
    - type: is-json
      metric: recipe-json
    - type: javascript
      value: |
        const recipe = JSON.parse(output);
        return Boolean(
          recipe.title
          && recipe.description
          && recipe.ingredients?.length
          && recipe.instructions?.length
          && recipe.properties?.total_minutes > 0
          && recipe.properties?.servings > 0
        );
      metric: complete-recipe
    # This assertion is intentionally generic, but it was prompted by recipe
    # https://careme.cooking/recipe/PtUhsZObI_8cUN07xNl4xA== from shopping list JcpTfxJ5UMM. The exact stored
    # menu plan and its associated doneness eval are included below.
    - type: javascript
      value: |
        const recipe = JSON.parse(output);
        const instructions = recipe.instructions.join(' ');
        const regulatoryAside = /\b(?:FDA|USDA)\b|government agency|official (?:food[- ]safety|temperature) guidance|safe minimum|regulatory temperature|guidance recommends/i;
        return !regulatoryAside.test(instructions);
      metric: concise-temperature-guidance

tests:
  # Generate real cases with:
  # go run ./cmd/evalcase -hash HASH -secret-file secrets/envprod
  - description: Yucatecan grilled chicken from cached menu plan
    vars:
      menu_plan:
        plans:
          - cuisine: Yucatecan
            anchor_ingredient: Simple Truth® Natural Boneless Skinless Fresh Chicken Breast Family Pack BIG DEAL!
            technique: grill
            side_vegetable: Fresh Sweet Corn on the Cob-Each
            fancy: false
            recipe_instructions:
              - Keep total time under 1 hour.
              - Serve 2 people.
        chef_note_suggestion: skip the scallop splurge
        response_id: resp_08d83f4a731aea48006a88bb37cc3887d0a1f62112b5081731
        prompt_cache_key: careme:store-day:v1:29c0fd07ffe51cb173c8a6b1
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output);
          const saltIngredients = recipe.ingredients.filter((ingredient) => /\bsalt\b/i.test(ingredient.name));
          const usesVolume = saltIngredients.length > 0 && saltIngredients.every((ingredient) =>
            /\b(?:teaspoons?|tablespoons?)\b/i.test(ingredient.quantity)
            && !/\b(?:grams?|g)\b/i.test(ingredient.quantity),
          );
          const saltText = [
            ...saltIngredients.map((ingredient) => `${ingredient.quantity} ${ingredient.name}`),
            ...recipe.instructions.filter((instruction) => /\bsalt\b/i.test(instruction)),
          ].join(' ');
          const exposesSaltWeight = /(?:\b(?:grams?|g)\b.{0,40}\bsalt\b|\bsalt\b.{0,40}\b(?:grams?|g)\b)/i.test(saltText);
          return usesVolume && !exposesSaltWeight;
        metric: salt-measured-by-volume
  # https://careme.cooking/recipe/PtUhsZObI_8cUN07xNl4xA==
  - description: Quality Food Center Bellevue East tri-tip from JcpTfxJ5UMM recommends medium-rare without a regulatory aside
    vars:
      menu_plan:
        plans:
          - cuisine: Korean
            anchor_ingredient: Certified Angus Beef Tri Tip Steak (2 Steak per Pack)
            technique: marinate and grill
            side_vegetable: Cucumber
            fancy: false
            recipe_instructions:
              - Use the grill; serve 2; finish within 1 hour.
              - Prioritize August WA produce.
              - Avoid coffee crust and corn.
        chef_note_suggestion: less sweet marinades
        response_id: resp_0bce0de54c56c531006a838d24ae388198851b394bbcd0ae8e
        prompt_cache_key: careme:store-day:v1:56417411224e2f1690f701fc
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output);
          const instructions = recipe.instructions.join(' ');
          const fahrenheit = /(?:°\s*F|degrees?\s+F(?:ahrenheit)?)/i;
          const mediumRareLabel = /medium[- ]rare/i.test(instructions) && fahrenheit.test(instructions);
          const mediumRareTemperature = Array.from(
            instructions.matchAll(/\b(\d{2,3})(?:\s*(?:-|–|to)\s*(\d{2,3}))?\s*(?:°\s*F|degrees?\s+F(?:ahrenheit)?)/gi),
          ).some((match) => {
            const temperatures = match[2] ? [Number(match[1]), Number(match[2])] : [Number(match[1])];
            return temperatures.every((temperature) => temperature >= 125 && temperature <= 135);
          });
          return mediumRareLabel || mediumRareTemperature;
        metric: chef-recommended-doneness

