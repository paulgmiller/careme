description: Menu plan generation eval
evaluateOptions:
  maxConcurrency: 4

# The Go provider ignores the rendered prompt and reads the test variables.
prompts:
  - menu-plan-eval

providers:
  - id: 'file://provider.go'
    label: menu-plan
    config:
      judge_model: google/gemini-3.1-pro-preview

defaultTest:
  assert:
    - type: javascript
      value: |
        const critique = context.providerResponse.metadata.critique;
        const score = Math.min(critique.request_fidelity, critique.culinary_coherence, critique.meaningful_variety);
        return {
          pass: score >= 8 && critique.issues.every((issue) => issue.severity === 'low'),
          score: score / 10,
          reason: [critique.summary, ...critique.issues.map((issue) =>
            `${issue.category} (recipes ${issue.recipe_indexes.join(', ')}): ${issue.detail} Fix: ${issue.suggested_fix}`)].join('\n'),
        };
      metric: menu-quality
    - type: latency
      threshold: 20000
      metric: menu-plan-latency-under-20s
    - type: is-json
      metric: menu-plan-json
    - type: javascript
      value: |
        const plan = JSON.parse(output);
        if (plan.plans?.length !== (context.vars.count ?? 1)) return false;
        const available = new Set(context.vars.ingredients.map((ingredient) => ingredient.description.toLowerCase()));
        const requested = new Set((context.vars.requested_ingredients ?? []).map((name) => name.toLowerCase()));
        return plan.plans.every((recipe) =>
          (available.has(recipe.anchor_ingredient.toLowerCase()) || requested.has(recipe.anchor_ingredient.toLowerCase()))
          && (available.has(recipe.side_vegetable.toLowerCase()) || requested.has(recipe.side_vegetable.toLowerCase())));
      metric: available-menu-ingredients
    - type: javascript
      value: |
        const recipes = JSON.parse(output).plans;
        const labels = recipes.flatMap((recipe) => [recipe.anchor_ingredient, recipe.side_vegetable])
          .map((label) => label.trim().toLowerCase().replace(/\s+/g, ' '));
        return new Set(labels).size === labels.length;
      metric: distinct-menu-ingredients
    - type: javascript
      value: |
        const plans = JSON.parse(output).plans;
        const formats = new Set([
          'pasta', 'soup/stew', 'grain bowl', 'noodle bowl', 'salad',
          'wrap/taco', 'sandwich/burger', 'stir-fry', 'curry',
          'flatbread/pizza', 'casserole/bake',
          'sheet-pan/roast', 'stuffed vegetable', 'main with sides',
        ]);
        const planned = plans.map((recipe) => recipe.dish_format?.trim().toLowerCase());
        if (planned.some((format) => !formats.has(format))) return false;
        return plans.length < 3 || new Set(planned).size >= 3;
      metric: canonical-dish-format-variety

    - type: javascript
      value: |
        const plans = JSON.parse(output).plans;
        const allowed = new Set(['healthy', 'fancy', 'local', 'different']);
        return plans.every((recipe) => allowed.has(recipe.category) && !('fancy' in recipe));
      metric: valid-meal-categories

tests:
  - description: One quick seasonal chicken dinner
    vars:
      location:
        id: eval-store-seattle
        name: Seattle Eval Store
        state: WA
      date: '2026-08-21'
      count: 1
      instructions: Keep dinner under 45 minutes.
      ingredients:
        - id: chicken-thighs
          description: Boneless Skinless Chicken Thighs
          size: 1.5 lb
        - id: broccoli
          description: Broccoli Crowns
          size: 1 lb
        - id: jasmine-rice
          description: Jasmine Rice
          size: 2 lb

  - description: Preserve long catalog names while honoring vegetarian and equipment constraints
    vars:
      location:
        id: eval-store-seattle
        name: Seattle Eval Store
        state: WA
      date: '2026-09-09'
      count: 1
      instructions: Make it vegetarian, stovetop only, and under 30 minutes.
      ingredients:
        - id: tofu
          description: Simple Truth Organic Extra Firm Tofu Twin Pack
          size: 16 oz
        - id: broccoli
          description: Simple Truth Organic Fresh Broccoli Florets Family Pack
          size: 12 oz
        - id: chicken
          description: Boneless Skinless Chicken Thighs
          size: 1.5 lb
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient === 'Simple Truth Organic Extra Firm Tofu Twin Pack'
            && recipe.side_vegetable === 'Simple Truth Organic Fresh Broccoli Florets Family Pack';
        metric: vegetarian-exact-catalog-labels

  - description: Three distinct dinners preserve global directions and assign limited saffron once
    vars:
      location:
        id: eval-store-seattle
        name: Seattle Eval Store
        state: WA
      date: '2026-09-10'
      count: 3
      instructions: Plan three dinners. Every dinner must serve 6 people. I have one pinch of saffron; use it in exactly one dinner. Use different anchor ingredients and different side vegetables across the dinners.
      ingredients:
        - id: chicken
          description: Boneless Skinless Chicken Thighs
          size: 2 lb
        - id: salmon
          description: Atlantic Salmon Fillet
          size: 2 lb
        - id: tofu
          description: Extra Firm Tofu
          size: 16 oz
        - id: broccoli
          description: Broccoli Crowns
          size: 1 lb
        - id: zucchini
          description: Zucchini
          size: 1 lb
        - id: carrots
          description: Carrots
          size: 1 lb
        - id: rice
          description: Basmati Rice
          size: 2 lb
    assert:
      - type: javascript
        value: |
          const recipes = JSON.parse(output).plans;
          return recipes.filter((recipe) => recipe.recipe_instructions.some((instruction) =>
            /\bsaffron\b/i.test(instruction))).length === 1;
        metric: limited-ingredient-assigned-once
      - type: javascript
        value: |
          return new Set(JSON.parse(output).plans.map((recipe) => recipe.category)).size === 3;
        metric: three-distinct-meal-categories
      - type: javascript
        value: |
          return JSON.parse(output).plans.every((recipe) =>
            recipe.recipe_instructions.some((instruction) =>
              /\b(?:6|six)\b/i.test(instruction) && /\b(?:serves?|servings?|people|persons?|portions?)\b/i.test(instruction)));
        metric: servings-preserved-in-every-recipe

  - description: Explicitly requested halloumi can anchor dinner outside the catalog
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: Use halloumi as the main ingredient.
      requested_ingredients: ["halloumi"]
      ingredients:
        - id: tofu
          description: Extra Firm Tofu
        - id: broccoli
          description: Broccoli
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient.toLowerCase() === 'halloumi'
            && recipe.recipe_instructions.some((instruction) => instruction.toLowerCase().includes(context.vars.requested_ingredients[0]))
            && recipe.recipe_instructions.some((instruction) => /halloumi/i.test(instruction));
        metric: requested-anchor-outside-catalog

  - description: Avoiding halloumi does not authorize an unavailable anchor
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: Make it vegetarian and do not use halloumi.
      ingredients:
        - id: tofu
          description: Extra Firm Tofu
        - id: broccoli
          description: Broccoli
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient === 'Extra Firm Tofu'
            && !recipe.recipe_instructions.some((instruction) => /^Use halloumi/i.test(instruction));
        metric: unavailable-anchor-not-authorized-by-exclusion

  - description: User-owned duroc pork retains only its ingredient name as the anchor
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: I have leftover duroc pork
      requested_ingredients: ["duroc pork"]
      ingredients:
        - id: chicken
          description: Chicken Thighs
        - id: broccoli
          description: Broccoli
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient.toLowerCase() === 'duroc pork'
            && recipe.recipe_instructions.some((instruction) => instruction.toLowerCase().includes(context.vars.requested_ingredients[0]));
        metric: user-owned-ingredient-name

  - description: User-owned dover sole retains only its ingredient name as the anchor
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: I got dover sole at Costco
      requested_ingredients: ["dover sole"]
      ingredients:
        - id: chicken
          description: Chicken Thighs
        - id: broccoli
          description: Broccoli
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient.toLowerCase() === 'dover sole'
            && recipe.recipe_instructions.some((instruction) => instruction.toLowerCase().includes(context.vars.requested_ingredients[0]));
        metric: user-owned-ingredient-name

  - description: Extra broccoli outside the catalog can be an anchor or a side
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: I have extra broccoli.
      requested_ingredients: ["broccoli"]
      ingredients:
        - id: chicken
          description: Chicken Thighs
        - id: carrots
          description: Carrots
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return (recipe.anchor_ingredient.toLowerCase() === 'broccoli'
              && recipe.recipe_instructions.some((instruction) => instruction.toLowerCase().includes(context.vars.requested_ingredients[0])))
            || (recipe.side_vegetable.toLowerCase() === 'broccoli'
              && recipe.recipe_instructions.some((instruction) => instruction.toLowerCase().includes(context.vars.requested_ingredients[0])));
        metric: user-owned-vegetable-either-role

  - description: Correct a typo in user-owned strawberries outside the catalog
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: I have extra strawberies. Make a strawbery and spinach salad.
      requested_ingredients: ["strawberries"]
      ingredients:
        - id: spinach
          description: Baby Spinach
        - id: cucumber
          description: Cucumber
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient.toLowerCase() === 'strawberries'
            && recipe.recipe_instructions.some((instruction) => /strawberr/i.test(instruction));
        metric: corrected-user-owned-anchor

  - description: Correct a typo in user-owned broccoli used as a side
    vars:
      location:
        id: eval-store-seattle
        state: WA
      date: '2026-09-10'
      count: 1
      instructions: I have extra brocoli. Roast chicken with brocoli on the side.
      requested_ingredients: ["broccoli"]
      ingredients:
        - id: chicken
          description: Chicken Thighs
        - id: carrots
          description: Carrots
    assert:
      - type: javascript
        value: |
          const recipe = JSON.parse(output).plans[0];
          return recipe.anchor_ingredient === 'Chicken Thighs'
            && recipe.side_vegetable.toLowerCase() === 'broccoli'
            && recipe.recipe_instructions.some((instruction) => /broccoli/i.test(instruction));
        metric: corrected-user-owned-side

  - description: Four seasonal regional dinners cover every category
    vars:
      location:
        id: eval-store-seattle
        name: Seattle Eval Store
        state: WA
      date: '2026-08-21'
      count: 4
      instructions: Plan four varied dinners.
      ingredients:
        - {id: salmon, description: Salmon Fillet, size: 1 lb}
        - {id: chicken, description: Chicken Thighs, size: 1 lb}
        - {id: tofu, description: Firm Tofu, size: 16 oz}
        - {id: lentils, description: Lentils, size: 1 lb}
        - {id: zucchini, description: Zucchini, size: 1 lb}
        - {id: tomatoes, description: Tomatoes, size: 1 lb}
        - {id: corn, description: Sweet Corn, size: 1 lb}
        - {id: beans, description: Green Beans, size: 1 lb}
        - {id: farro, description: Farro, size: 1 lb}
    assert:
      - type: javascript
        value: |
          return new Set(JSON.parse(output).plans.map((recipe) => recipe.category)).size === 4;
        metric: all-four-meal-categories
